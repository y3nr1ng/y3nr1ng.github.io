name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  check-links-on-site:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: _site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check local page links
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          args: --offline --root-dir "${{ github.workspace }}/_site" --verbose --no-progress '_site/*.html' '_site/projects/**/*.html'
