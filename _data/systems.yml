- title: Single-molecule microscopy
  role: System design and image analysis
  description: Super-resolution imaging by locating individual fluorescent molecules. Related work includes system design, localization processing, 3D geometric analysis, and TORQUE-based workflows for single-molecule localization microscopy (SMLM).
  publications:
    - title: Lightsheet localization microscopy enables fast, large-scale, and three-dimensional super-resolution imaging
      label: Communications Biology, 2019
      date: "2019-05-09"
      url: https://doi.org/10.1038/s42003-019-0403-9
    - title: Rapid single-wavelength lightsheet localization microscopy for clarified tissue
      label: Nature Communications, 2019
      date: "2019-10-18"
      url: https://doi.org/10.1038/s41467-019-12715-3
  projects:
